[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-knowledge-assistant"
version = "0.3.2"
description = "Evidence-grounded policy answers with permission-aware retrieval and controlled workflows."
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Gateway Information Group LLC"}]
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "python-multipart==0.0.31",
  "pypdf==6.15.0",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
